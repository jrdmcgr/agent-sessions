version: 2

project_name: sessions

builds:
  - id: sessions
    binary: sessions
    main: .
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: sessions
    formats: [tar.gz]
    name_template: "sessions_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: jrdmcgr
    name: agent-sessions

changelog:
  disable: true
